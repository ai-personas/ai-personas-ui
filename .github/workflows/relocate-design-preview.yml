name: Relocate existing design preview
on:
  push:
    branches: ['rewrite/design-first']
    paths: ['.github/workflows/relocate-design-preview.yml']
permissions:
  contents: write
jobs:
  relocate:
    if: github.repository == 'ai-personas/ai-personas-ui' && github.ref == 'refs/heads/rewrite/design-first'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ai-personas/ai-personas-design
          ref: 9b1fd0a82ee4c5c6eb6f87aac4f2f9495f14d41d
          path: .migration-design
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Relocate exact preview files, retaining their module boundary
        run: |
          python3 - <<'PY'
          import hashlib, json, shutil, subprocess
          from pathlib import Path
          source = Path('.migration-design')
          revision = '9b1fd0a82ee4c5c6eb6f87aac4f2f9495f14d41d'
          actual = subprocess.check_output(['git', '-C', str(source), 'rev-parse', 'HEAD'], text=True).strip()
          if actual != revision:
              raise SystemExit('Source revision mismatch')
          tests = ['browser_design.py', 'browser_reference.py', 'design-state.test.cjs', 'reference-screens.test.cjs']
          destinations = [Path('design')] + [Path('tests') / name for name in tests] + [Path('docs/PREVIEW-MIGRATION.md')]
          if any(p.exists() for p in destinations):
              raise SystemExit('Refusing to overwrite an existing destination')
          shutil.copytree(source / 'design', 'design')
          Path('tests').mkdir(exist_ok=True)
          for name in tests:
              shutil.copy2(source / 'tests' / name, Path('tests') / name)
          copied = ['design/' + p.name for p in (source / 'design').iterdir()] + ['tests/' + name for name in tests]
          hashes = {}
          for name in copied:
              before, after = (source / name).read_bytes(), Path(name).read_bytes()
              if before != after:
                  raise SystemExit('Copy differs: ' + name)
              hashes[name] = hashlib.sha256(after).hexdigest()
          # The destination root is ESM. Preserve the fixture's existing CommonJS
          # test exports without changing browser scripts or the production package.
          Path('design/package.json').write_text('{"private": true, "type": "commonjs"}\n')
          readme = Path('design/README.md')
          text = readme.read_text()
          base = 'https://github.com/ai-personas/ai-personas-design/blob/rewrite/design-first/'
          for target in ['technical/UI.md', 'technical/SPEC.md', 'STATUS.md']:
              text = text.replace('(../' + target + ')', '(' + base + target + ')')
          old = 'The existing repository documentation checks remain applicable:\n\n```sh\npython3 -m unittest discover -s tests -v\npython3 scripts/check_docs.py\n```'
          text = text.replace(old, 'Design-document validation tooling belongs to `ai-personas/ai-personas`, under `tools/design_docs`; it is not part of this UI fixture.')
          readme.write_text('> Relocated from `ai-personas-design@' + revision + '`. Browser scripts, styles, markup and fixture tests are byte-identical. A local CommonJS package boundary preserves Node test behavior inside the ESM UI repository. Production Preact source is unchanged.\n\n' + text)
          Path('docs').mkdir(exist_ok=True)
          Path('docs/PREVIEW-MIGRATION.md').write_text('# Existing preview relocation\n\nThe standalone `design/` preview and its four tests were copied from\n`ai-personas/ai-personas-design@' + revision + '`.\nThis is a relocation, not a UI redesign, production integration, or Rust\nimplementation. Original code and evidence remain in Git history.\n\n`design/migration.json` records original copied hashes before README link\nadjustments. Browser source and tests are unchanged. `design/package.json`\npreserves the CommonJS boundary expected by the existing Node tests without\nchanging the production ESM package. The temporary migration workflow is\nremoved after the checked relocation.\n\nRun from the UI root:\n\n```sh\nnode --test tests/design-state.test.cjs tests/reference-screens.test.cjs\npython3 tests/browser_design.py\npython3 tests/browser_reference.py\n```\n\nBrowser tests need Python Playwright and Chromium. They test illustrative\nfixtures, not real personas or engineering results.\n')
          Path('design/migration.json').write_text(json.dumps({'source_repository': 'ai-personas/ai-personas-design', 'source_commit': revision, 'destination_repository': 'ai-personas/ai-personas-ui', 'branch': 'rewrite/design-first', 'original_file_sha256': hashes, 'adjusted_documents': ['design/README.md'], 'added_module_boundary': 'design/package.json', 'production_ui_source_changed': False, 'runtime_source_copied': False}, indent=2) + '\n')
          root = Path('README.md')
          root.write_text(root.read_text() + '\n\n## Standalone design references\n\nThe screen fixture now lives in [design/](design/README.md), with\n[relocation provenance](docs/PREVIEW-MIGRATION.md). It is separate from\nthe production Preact application. Rust implementation belongs to\n`ai-personas/ai-personas`; normative documentation belongs to\n`ai-personas/ai-personas-design`, all on `rewrite/design-first`.\n')
          PY
      - name: Check relocated code and behavior
        run: |
          for file in design/*.js; do node --check "$file"; done
          node --test tests/design-state.test.cjs tests/reference-screens.test.cjs
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
          python3 tests/browser_design.py
          python3 tests/browser_reference.py
      - name: Commit relocation without changing production UI or workflows
        run: |
          git diff --exit-code -- src package.json package-lock.json API.md api.schema.json .github
          git add README.md design docs/PREVIEW-MIGRATION.md tests/browser_design.py tests/browser_reference.py tests/design-state.test.cjs tests/reference-screens.test.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Move existing screen fixture and browser tests out of design docs'
          git push origin HEAD:refs/heads/rewrite/design-first
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-relocation-evidence
          path: .qa/
          include-hidden-files: true

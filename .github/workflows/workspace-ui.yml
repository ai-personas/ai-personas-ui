name: Rust-branch workspace UI
on:
  push:
    branches: [rewrite/design-first, ui/rust-v1.2-workspace]
  pull_request:
    branches: [rewrite/design-first]
permissions:
  contents: read
concurrency:
  group: workspace-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Record immutable UI source archive digest
        if: github.event_name == 'push'
        shell: bash
        run: |
          mkdir -p .qa
          archive="${RUNNER_TEMP}/ui-${GITHUB_SHA}.tar.gz"
          curl --fail --location --proto '=https' --proto-redir '=https' --retry 3 --max-time 120 \
            "https://codeload.github.com/ai-personas/ai-personas-ui/tar.gz/${GITHUB_SHA}" --output "$archive"
          digest="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          printf 'UI_REVISION=%s\nUI_ARCHIVE_SHA256=%s\n' "$GITHUB_SHA" "$digest" | tee .qa/ui-source-digest.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:identity
      - run: npm run test:workspace
      - run: npm run test:forms
      - name: Archive and evidence components (synthetic fixtures only)
        run: npm run test:reliability
      - name: Review continuity (synthetic fixture only)
        run: node tests/review-continuity.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-ui-fixture-evidence
          path: .qa/
          include-hidden-files: true
